<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markets - PayAgent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#0B1A2E;--dark2:#0F2440;--dark3:#162D50;--accent:#00D4AA;--accent2:#0099FF;--light:#F0F4F8;--white:#FFFFFF;--gray:#6B7D8E;--gray-light:#94A3B8;--text-light:#D8E4F0;--radius:12px;--radius-lg:20px}
html{font-size:16px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--dark);color:var(--white);line-height:1.6;min-height:100vh}
a{text-decoration:none;color:inherit}

.nav{padding:16px 0;background:rgba(11,26,46,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.05);position:sticky;top:0;z-index:100}
.nav-inner{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:0 24px}
.nav-logo{font-size:1.4rem;font-weight:800;display:flex;align-items:center;gap:10px}
.nav-back{display:flex;align-items:center;gap:8px;font-size:0.9rem;color:var(--gray-light);transition:color 0.2s}
.nav-back:hover{color:var(--accent)}

.page{max-width:900px;margin:0 auto;padding:80px 24px 100px}
.badge{display:inline-block;padding:6px 16px;border-radius:50px;font-size:0.75rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);margin-bottom:20px}
h1{font-size:2.6rem;font-weight:900;line-height:1.1;margin-bottom:20px}
h1 .accent{color:var(--accent)}
.subtitle{font-size:1.1rem;color:var(--gray-light);line-height:1.7;margin-bottom:48px;max-width:680px}

.flag{font-size:3rem;margin-bottom:16px}
.section{margin-bottom:40px}
.section h2{font-size:1.2rem;font-weight:700;margin-bottom:14px;color:var(--accent)}
.section p{font-size:0.95rem;color:var(--text-light);line-height:1.8;margin-bottom:12px}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:48px}
.stat{background:var(--dark2);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius);padding:24px;text-align:center}
.stat .num{font-size:1.8rem;font-weight:800;color:var(--accent);margin-bottom:4px}
.stat .label{font-size:0.78rem;color:var(--gray-light);text-transform:uppercase;letter-spacing:0.5px}

.rails-list{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.rail-chip{background:var(--dark2);border:1px solid rgba(0,212,170,0.2);border-radius:8px;padding:8px 16px;font-size:0.85rem;font-weight:600;color:var(--accent)}

.market-nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:48px;padding-top:32px;border-top:1px solid rgba(255,255,255,0.06)}
.market-nav-label{font-size:0.78rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--gray);width:100%;margin-bottom:4px}
.market-link{background:var(--dark2);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 20px;font-size:0.88rem;font-weight:600;color:var(--gray-light);transition:all 0.2s}
.market-link:hover,.market-link.active{border-color:var(--accent);color:var(--accent)}

.cta-box{background:linear-gradient(135deg,var(--dark2),var(--dark3));border:1px solid rgba(0,212,170,0.2);border-radius:var(--radius-lg);padding:48px;text-align:center;margin-top:48px}
.cta-box h2{font-size:1.5rem;font-weight:800;margin-bottom:12px}
.cta-box p{color:var(--gray-light);margin-bottom:24px}
.btn{display:inline-block;padding:14px 32px;border-radius:var(--radius);font-weight:600;font-size:0.95rem;transition:all 0.3s}
.btn-primary{background:var(--accent);color:var(--dark)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,212,170,0.3)}

@media(max-width:768px){h1{font-size:2rem}.stats-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect x="4" y="8" width="24" height="16" rx="4" fill="#00D4AA"/><circle cx="12" cy="16" r="3" fill="#0B1A2E"/><circle cx="20" cy="16" r="3" fill="#0B1A2E"/><rect x="10" y="4" width="12" height="6" rx="3" fill="#00D4AA" opacity="0.6"/><rect x="2" y="14" width="4" height="4" rx="2" fill="#00D4AA" opacity="0.6"/><rect x="26" y="14" width="4" height="4" rx="2" fill="#00D4AA" opacity="0.6"/></svg>
      PayAgent
    </a>
    <a href="index.html" class="nav-back">&larr; Back to Home</a>
  </div>
</nav>

<div class="page">
  <span class="badge" id="badge">Market</span>
  <div class="flag" id="flag"></div>
  <h1 id="title"></h1>
  <p class="subtitle" id="subtitle"></p>

  <div class="stats-row" id="stats"></div>

  <div class="section">
    <h2>Payment Rails</h2>
    <p id="rails-desc"></p>
    <div class="rails-list" id="rails"></div>
  </div>

  <div class="section">
    <h2>Why This Market</h2>
    <p id="why-text"></p>
  </div>

  <div class="section">
    <h2>PayAgent in <span id="country-name"></span></h2>
    <p id="payagent-text"></p>
  </div>

  <div class="market-nav">
    <div class="market-nav-label">Explore Markets</div>
    <a href="market.html?m=brazil" class="market-link" data-m="brazil">Brazil</a>
    <a href="market.html?m=mexico" class="market-link" data-m="mexico">Mexico</a>
    <a href="market.html?m=colombia" class="market-link" data-m="colombia">Colombia</a>
    <a href="market.html?m=argentina" class="market-link" data-m="argentina">Argentina</a>
    <a href="market.html?m=chile" class="market-link" data-m="chile">Chile</a>
  </div>

  <div class="cta-box">
    <h2>Ready to accept payments in <span id="cta-country"></span>?</h2>
    <p>Join the waitlist for early access when we launch.</p>
    <a href="waitlist.html" class="btn btn-primary">Join the Waitlist &rarr;</a>
  </div>
</div>

<script>
const markets = {
  brazil: {
    badge: 'Phase 1 Market',
    flag: '&#127463;&#127479;',
    title: 'PayAgent in <span class="accent">Brazil.</span>',
    subtitle: 'Brazil is the largest digital payments market in Latin America. PIX crossed 78 billion transactions in 2025, and 89% of micro and small businesses already accept it. PayAgent launches here first.',
    stats: [
      { num: '78B+', label: 'PIX transactions (2025)' },
      { num: '89%', label: 'SMEs accepting PIX' },
      { num: '61.9M', label: 'Open finance consents' }
    ],
    rails: ['PIX', 'Boleto', 'Credit Cards', 'TED/DOC'],
    railsDesc: 'PIX dominates instant payments and now accounts for 40% of e-commerce volume. PayAgent routes intelligently across PIX, boleto, and card rails based on transaction context.',
    why: 'Brazil has the most mature instant payment infrastructure in the region. Open finance hit 61.9 million active consents in 2024 — up 45% year over year — which means platforms like PayAgent can plug into banking data with user permission. The SME market is massive: millions of businesses are digital-first but still managing payments manually.',
    payagent: 'PayAgent launches in Brazil as its anchor market. Our AI agents optimize routing across PIX, boleto, and card rails in real time. Auto-reconciliation eliminates the hours SMEs spend matching payments across systems. One dashboard, one API, every Brazilian payment method.',
  },
  mexico: {
    badge: 'Phase 1 Market',
    flag: '&#127474;&#127485;',
    title: 'PayAgent in <span class="accent">Mexico.</span>',
    subtitle: 'Mexico is Latin America\'s second-largest economy with a rapidly growing digital payments ecosystem. SPEI handles real-time transfers and the open banking push is accelerating.',
    stats: [
      { num: '$85B+', label: 'Digital payment volume' },
      { num: '4.9M', label: 'SMEs in Mexico' },
      { num: '2nd', label: 'Largest LatAm economy' }
    ],
    rails: ['SPEI', 'CoDi', 'OXXO Pay', 'Credit Cards'],
    railsDesc: 'SPEI is the backbone of real-time transfers in Mexico. PayAgent integrates SPEI alongside cash-based methods like OXXO Pay and traditional card rails for full coverage.',
    why: 'Mexico\'s fintech law is creating a more structured regulatory environment, and SPEI provides reliable real-time rails. The SME segment is underserved by existing payment infrastructure players who focus on enterprise clients.',
    payagent: 'PayAgent enters Mexico alongside Brazil in Phase 1. Our platform connects to SPEI, CoDi, OXXO Pay, and card networks through a single integration. AI routing picks the optimal method for each transaction based on cost, speed, and reliability.',
  },
  colombia: {
    badge: 'Phase 2 Market',
    flag: '&#127464;&#127476;',
    title: 'PayAgent in <span class="accent">Colombia.</span>',
    subtitle: 'Colombia launched BRE-B in October 2025 — their version of instant payments — and new mandatory open finance rules are creating fresh infrastructure opportunities.',
    stats: [
      { num: 'BRE-B', label: 'New instant payment rail' },
      { num: '2.5M+', label: 'SMEs in Colombia' },
      { num: '2025', label: 'Open finance mandate' }
    ],
    rails: ['PSE', 'BRE-B', 'Efecty', 'Credit Cards'],
    railsDesc: 'PSE has been Colombia\'s main online payment system. BRE-B adds instant payment capability. PayAgent will integrate both alongside cash collection through Efecty and card networks.',
    why: 'Colombia is the natural follow-on market after Brazil. BRE-B and mandatory open finance rules signal that the country is building modern payment infrastructure. The SME segment is growing fast and digitizing rapidly.',
    payagent: 'PayAgent expands to Colombia in Phase 2 (months 7-18). Our AI agents will route across PSE, BRE-B, Efecty, and cards — choosing the best rail for each transaction. Early integration with BRE-B gives us a first-mover advantage.',
  },
  argentina: {
    badge: 'Phase 2 Market',
    flag: '&#127462;&#127479;',
    title: 'PayAgent in <span class="accent">Argentina.</span>',
    subtitle: 'Argentina\'s payment landscape is evolving rapidly. Despite macroeconomic volatility, digital payment adoption is surging among SMEs looking for better tools to manage multi-currency operations.',
    stats: [
      { num: '850K+', label: 'SMEs in Argentina' },
      { num: '3x', label: 'Digital payment growth' },
      { num: '#3', label: 'LatAm fintech ecosystem' }
    ],
    rails: ['Transferencias', 'Mercado Pago', 'DEBIN', 'Credit Cards'],
    railsDesc: 'Argentina\'s payment rails include bank transfers, DEBIN (direct debit), and the dominant Mercado Pago ecosystem. PayAgent integrates across all channels for unified coverage.',
    why: 'Argentina has Latin America\'s third-largest fintech ecosystem. SMEs deal with multi-currency complexity and need intelligent tools for FX optimization and reconciliation. Digital payment adoption is accelerating despite — and partly because of — economic uncertainty.',
    payagent: 'PayAgent enters Argentina in Phase 2. Our multi-currency engine and FX optimization are especially valuable here. AI-powered reconciliation across the fragmented rail landscape gives Argentine SMEs a single source of truth for their payment operations.',
  },
  chile: {
    badge: 'Phase 2 Market',
    flag: '&#127464;&#127473;',
    title: 'PayAgent in <span class="accent">Chile.</span>',
    subtitle: 'Chile has one of the most stable regulatory environments in Latin America and a fast-growing fintech ecosystem. The 2023 Fintech Law created a clear framework for payment innovation.',
    stats: [
      { num: '1M+', label: 'SMEs in Chile' },
      { num: '2023', label: 'Fintech Law enacted' },
      { num: '80%+', label: 'Banked population' }
    ],
    rails: ['TEF', 'Webpay', 'Khipu', 'Credit Cards'],
    railsDesc: 'Chile uses TEF for bank transfers, Webpay for online card payments, and Khipu for bank-to-bank transfers. PayAgent unifies all rails through a single API.',
    why: 'Chile\'s Fintech Law and high banked population make it an attractive, lower-risk expansion market. The regulatory clarity makes compliance integration straightforward. SMEs are sophisticated but still lack unified payment tools.',
    payagent: 'PayAgent rounds out its LatAm coverage with Chile in Phase 2. The stable regulatory environment lets us move quickly. Our platform integrates TEF, Webpay, Khipu, and card rails — giving Chilean SMEs the same AI-powered orchestration available in our other markets.',
  }
};

// Read market from URL
const params = new URLSearchParams(window.location.search);
let m = params.get('m') || 'brazil';
if (!markets[m]) m = 'brazil';
const data = markets[m];

// Populate page
document.title = `${m.charAt(0).toUpperCase() + m.slice(1)} - PayAgent Markets`;
document.getElementById('badge').textContent = data.badge;
document.getElementById('flag').innerHTML = data.flag;
document.getElementById('title').innerHTML = data.title;
document.getElementById('subtitle').textContent = data.subtitle;

let statsHTML = '';
data.stats.forEach(s => {
  statsHTML += `<div class="stat"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`;
});
document.getElementById('stats').innerHTML = statsHTML;

document.getElementById('rails-desc').textContent = data.railsDesc;
let railsHTML = '';
data.rails.forEach(r => { railsHTML += `<span class="rail-chip">${r}</span>`; });
document.getElementById('rails').innerHTML = railsHTML;

document.getElementById('why-text').textContent = data.why;
document.getElementById('country-name').textContent = m.charAt(0).toUpperCase() + m.slice(1);
document.getElementById('payagent-text').textContent = data.payagent;
document.getElementById('cta-country').textContent = m.charAt(0).toUpperCase() + m.slice(1);

// Highlight active market link
document.querySelectorAll('.market-link').forEach(link => {
  if (link.dataset.m === m) link.classList.add('active');
});
</script>

</body>
</html>
